<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="14" fill="#0B1221"/>
  <defs>
    <linearGradient id="ag" x1="34" y1="18" x2="58" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="55%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
  </defs>

  <!-- n: geometric lowercase, white -->
  <path d="M7,44 V21 C7,14 25,14 25,21 V44"
        stroke="white" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- orange accent dot at top of n arch -->
  <circle cx="16" cy="14" r="2.8" fill="#F97316"/>

  <!-- subtle + between n and alpha -->
  <line x1="28.5" y1="32" x2="33.5" y2="32" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <line x1="31" y1="29.5" x2="31" y2="34.5" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

  <!-- α as single-storey a: bowl (left arc) + stem (right vertical) -->
  <!-- Bowl: smooth cubic bezier from top of stem, around left, back to bottom of stem -->
  <path d="M54,22 C46,20 34,24 34,33 C34,42 46,46 54,44"
        stroke="url(#ag)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <!-- Stem: vertical right side of the a -->
  <path d="M54,21 L54,45"
        stroke="url(#ag)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
</svg>