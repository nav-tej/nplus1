<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="14" fill="#0B1221"/>
  <defs>
    <linearGradient id="ag" x1="42" y1="18" x2="62" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="60%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
  </defs>
  <!-- n: geometric lowercase, white -->
  <path d="M8,44 V21 C8,14 26,14 26,21 V44"
        stroke="white" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- small orange dot at top of n arch — ties to alpha color -->
  <circle cx="17" cy="14" r="2.5" fill="#F97316"/>
  <!-- α bowl: CCW large arc, gap at upper-right (~60deg opening) -->
  <path d="M52,27 A10,10 0 1,0 52,39"
        stroke="url(#ag)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <!-- α tail: long rightward sweep then arcs back — makes it read as α not c -->
  <path d="M52,39 Q62,48 60,31"
        stroke="url(#ag)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
</svg>