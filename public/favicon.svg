<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#0B1221"/>

  <defs>
    <!-- Arrow gradient: orange (base) → blue (tip) -->
    <linearGradient id="ag" x1="14" y1="52" x2="50" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="55%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
  </defs>

  <!-- Arrow shaft -->
  <line x1="14" y1="52" x2="40" y2="21" stroke="url(#ag)" stroke-width="7.5" stroke-linecap="round"/>

  <!-- Arrowhead (tip at upper-right: 50,10) -->
  <polygon points="50,10 46,26 36,16" fill="url(#ag)"/>

  <!-- Outer orange swoosh arc -->
  <path d="M 5 48 C 15 56 36 53 53 41" stroke="#F97316" stroke-width="4.5" fill="none" stroke-linecap="round"/>

  <!-- Inner orange swoosh arc -->
  <path d="M 9 42 C 18 49 36 47 50 36" stroke="#F97316" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7"/>

  <!-- Orange dot at arrow tip -->
  <circle cx="50" cy="10" r="5.5" fill="#F97316"/>
</svg>
